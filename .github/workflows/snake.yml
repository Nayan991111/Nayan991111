# Contribution snake, light + dark, regenerated daily from your full contribution
# calendar (private contributions included as counts, via METRICS_TOKEN) and
# published to the `output` branch that README.md reads. Public repo: free minutes.
name: Generate snake

on:
  schedule:
    - cron: '0 1 * * *' # 06:30 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Your own token, so the calendar includes private contributions
          # (GITHUB_TOKEN only sees public ones: 60 of your active days).
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
