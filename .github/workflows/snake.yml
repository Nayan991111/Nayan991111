# Contribution snake, light + dark, regenerated daily from your public contribution
# calendar (which already includes private contributions as counts) and published
# to the `output` branch that README.md reads. Public repo: free Actions minutes.
name: Generate snake

on:
  schedule:
    - cron: '0 1 * * *' # 06:30 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
