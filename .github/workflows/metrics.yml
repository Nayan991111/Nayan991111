# metrics.svg: commits, PRs, reviews, issues and languages INCLUDING private
# repositories (counts only — no private repo names or code are shown).
# Needs repository secret METRICS_TOKEN = classic PAT with scopes repo, read:user.
name: Metrics

on:
  schedule:
    - cron: '30 0 * * *' # 06:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: activity, community, repositories
          config_timezone: Asia/Kolkata
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_colors: github
